name: Purge Pages History
on:
  push:
    branches: [ main ]

permissions:
  deployments: write
  contents: write

jobs:
  clear-history:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Pages Deployment
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true

